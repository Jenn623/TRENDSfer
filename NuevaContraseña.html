<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="shortcut icon" href="img/arrows.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles/estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Syne+Mono&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="foco" aria-hidden="true"></div>
    <header><img class="logo" src="./img/Logo-TRENDSfer.jpeg" alt="TRENDSfer"></header>
    <main>
        <section>
            <div class="recuperarContraseña">
                <h1>Recuperar contraseña</h1>
                <form class="form-recuperarContraseña">
                    <p>Nueva Contraseña</p>
                    <input type="password" name="contraseña" placeholder="******" required>
                    <button class="btn-enviarRecuperarContraseña" type="submit">Ingresar</button>
                </form>
            </div>
        </section>
    </main>
    <footer><img class="footer-iniciarsesion" src="./img/Logo-ITRENDS.jpeg" alt="ITRENDS"></footer>
    <script type="module" src="NuevaContraseña.js"></script>
</body>
</html>
