<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceptar Deuda</title>
    <link rel="shortcut icon" href="img/arrows.svg" type="image/x-icon">
     <link rel="stylesheet" href="styles/principal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Syne+Mono&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body class="ticket-page aceptar-deuda-page">
    <header>
        <picture>
            <img src="./img/Logo-TRENDSfer.jpeg" alt="TRENDSfer" class="logo-ticket">
        </picture>
        <a class="profile profile-link" href="./cuenta.html" aria-label="Ir a Cuenta">
            <h1>U</h1>
        </a>
    </header>
    <main>
        <section>
            <div class="Aceptar-Deuda">
                <h1>Confirmar deuda</h1>
                <p data-deuda-descripcion>Cargando los datos de la deuda...</p>
                <p class="aceptar-deuda-hint">Al aceptarla, podrás pagarla después desde la sección Deudas/Deudores.</p>
                <button class="Aceptar" type="button" data-aceptar-deuda disabled>Cargando...</button>
            </div>
        </section>
    </main>
    <footer>
        <img class="logo-footer" src="./img/svg_TRENDSfer.svg" alt="TRENDSfer">
        <div class="options" id="ticket"><a href="./ticket.html">Ticket</a></div>
        <div class="options active" id="deudas-deudores"><a href= "./principal.html">Deudas/Deudores</a></div>
        <div class="options" id="amigos"><a href="./amigos.html">Amigos</a></div>
        <div class="options" id="cuenta"><a href="./cuenta.html">Cuenta</a></div>
        <a class="avatar-photo profile-link" href="./cuenta.html" aria-label="Ir a Cuenta"><h1>U</h1></a>
    </footer>
    <script type="module" src="./aceptar-deuda.js"></script>
</body>
</html>
