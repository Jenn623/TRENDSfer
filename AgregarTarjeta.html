<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Tarjeta</title>
    <link rel="shortcut icon" href="img/arrows.svg" type="image/x-icon">
    <link rel="stylesheet" href="styles/cuenta.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Syne+Mono&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
         <div class="btn-volver">
        <p><a href="./cuenta.html">< volver</a></p>
      </div>
        <a class="profile profile-link" href="./cuenta.html" aria-label="Ir a Cuenta">
          <h1 data-usuario-inicial>U</h1>
        </a>
      <h1 class="Usuario" data-usuario-nombre>Usuario</h1>
    </header>
    <main>
        <section class="card">
            <div class="AgregarTarjeta">
                <h1>Agregar cuenta CoDi</h1>
                <form class="Form-AgregarTarjeta">
                    <label for="alias-cuenta">Alias (opcional)</label>
                    <input id="alias-cuenta" type="text" name="alias" maxlength="80" placeholder="Mi cuenta">

                    <label for="clabe-interbancaria">CLABE interbancaria</label>
                    <input id="clabe-interbancaria" type="text" name="clabeInterbancaria" inputmode="numeric" autocomplete="off" maxlength="18" pattern="[0-9]{18}" placeholder="18 dígitos" required>

                    <label for="banco">Banco</label>
                    <input id="banco" type="text" name="banco" maxlength="100" autocomplete="organization" placeholder="Nombre del banco" required>

                    <label for="nombre-titular">Nombre del titular</label>
                    <input id="nombre-titular" type="text" name="nombreTitular" maxlength="150" autocomplete="name" placeholder="Nombre del titular" required>

                    <label for="numero-celular">Número celular (opcional)</label>
                    <input id="numero-celular" type="tel" name="numeroCelular" maxlength="20" autocomplete="tel" placeholder="Número asociado a CoDi">

                    <label for="id-registro-codi">ID de registro CoDi (opcional)</label>
                    <input id="id-registro-codi" type="text" name="idRegistroCodi" maxlength="100" placeholder="ID proporcionado por CoDi">

                    <button class="btn-GuardarTarjeta" type="submit">Guardar cuenta</button>
                </form>
                <div class="tarjetas-guardadas" data-tarjetas-guardadas aria-live="polite"></div>
            </div>
        </section>
    </main>
    <footer><div class="options" id="ticket"><a href="./ticket.html">Ticket</a></div>
        <div class="options" id="deudas-deudores"><a href= "./principal.html">Deudas/Deudores</a></div>
        <div class="options" id="amigos"><a href="./amigos.html">Amigos</a></div>
        <div class="options active" id="cuenta"><a href="./cuenta.html">Cuenta</a></div></footer>
    <script type="module">
        import { iniciarCuentasCodi } from './cuentas-codi.js';
        iniciarCuentasCodi(document);
    </script>
</body>
</html>
